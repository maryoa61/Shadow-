name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # فعلاً فقط نسخهٔ مخصوص گوشی‌های ARM64 ساخته می‌شود.
      SHADOW_NET_ABIS: arm64-v8a

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # جلوگیری از ساخت مجدد APK با سورس قدیمی و بدون صفحهٔ Import
      - name: Verify configuration importer source
        shell: bash
        run: |
          echo "Building commit: $GITHUB_SHA"
          git log -1 --oneline

          REQUIRED_FILES=(
            "app/src/main/java/com/example/data/importer/ConfigLinkParser.kt"
            "app/src/main/java/com/example/ui/screens/ImportConfigScreen.kt"
            "app/src/main/java/com/example/MainActivity.kt"
            "app/src/main/java/com/example/ui/screens/ServersScreen.kt"
            "app/src/main/java/com/example/viewmodel/VpnViewModel.kt"
            "app/src/main/java/com/example/vpn/ShadowVpnService.kt"
            "scripts/fetch-vpn-cores.sh"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Required source file is missing: $file" >&2
              echo "The importer changes have not been pushed to this branch." >&2
              exit 1
            fi
          done

          if ! grep -q "ImportConfigScreen" \
            app/src/main/java/com/example/MainActivity.kt; then
            echo "MainActivity is not connected to ImportConfigScreen." >&2
            exit 1
          fi

          if ! grep -q "ConfigLinkParser" \
            app/src/main/java/com/example/ui/screens/ImportConfigScreen.kt; then
            echo "ImportConfigScreen is not connected to ConfigLinkParser." >&2
            exit 1
          fi

          if ! grep -q "SHADOW_NET_ABIS" app/build.gradle.kts; then
            echo "app/build.gradle.kts does not support single-ABI builds." >&2
            exit 1
          fi

          echo "Configuration importer source verified."

      # JDK 21 برای Gradle و Android Gradle Plugin
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify JDK 21 runtime
        shell: bash
        run: |
          java -version

          JAVA_SPEC_VERSION="$(
            java -XshowSettings:properties -version 2>&1 |
            awk '/java.specification.version/ { print $3 }'
          )"

          if [[ "$JAVA_SPEC_VERSION" != "21" ]]; then
            echo "Expected JDK 21, but found Java $JAVA_SPEC_VERSION" >&2
            exit 1
          fi

          echo "JDK 21 verified."

      # چون gradlew و gradle-wrapper.jar داخل مخزن نیستند،
      # نسخهٔ موردنیاز Gradle مستقیماً نصب می‌شود.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # نصب Android Command-line Tools، پلتفرم و Build Tools
      - name: Set up Android SDK and command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          packages: "platform-tools platforms;android-36.1 build-tools;36.0.0"

      - name: Verify Android SDK installation
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "$SDK_ROOT" ]]; then
            echo "ANDROID_SDK_ROOT and ANDROID_HOME are not set." >&2
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager was not found at: $SDKMANAGER" >&2

            echo "Available sdkmanager files:"
            find "$SDK_ROOT/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -name sdkmanager \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Android SDK root: $SDK_ROOT"
          echo "sdkmanager path: $SDKMANAGER"

          "$SDKMANAGER" --version

          if [[ ! -d "$SDK_ROOT/platforms/android-36.1" ]]; then
            echo "Android SDK platform android-36.1 is missing." >&2
            exit 1
          fi

          if [[ ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            echo "Android Build Tools 36.0.0 are missing." >&2
            exit 1
          fi

          echo "Android SDK installation verified."

      # کلید Debug بین اجرای Actions حفظ می‌شود تا بتوان APK جدید را
      # بدون حذف نسخهٔ قبلی روی گوشی نصب کرد.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: shadow-net-debug-keystore-v1

      - name: Create debug signing key
        shell: bash
        run: |
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          keytool -list \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey

      # SHADOW_NET_ABIS از env فقط arm64-v8a است.
      # اسکریپت preBuild نیز فقط هستهٔ sing-box مربوط به ARM64 را می‌گیرد.
      - name: Lint, test, and build arm64-v8a debug APK
        shell: bash
        run: |
          echo "Target ABI: $SHADOW_NET_ABIS"

          gradle \
            --no-daemon \
            --stacktrace \
            lintDebug \
            testDebugUnitTest \
            assembleDebug

      # بررسی می‌کند دقیقاً یک APK ساخته شده و هیچ کتابخانهٔ x86 یا ARM32
      # وارد فایل خروجی نشده باشد.
      - name: Verify single-ABI APK
        shell: bash
        run: |
          mapfile -t APKS < <(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*arm64-v8a*.apk'
          )

          if [[ "${#APKS[@]}" -ne 1 ]]; then
            echo "Expected exactly one arm64-v8a APK." >&2
            echo "Found ${#APKS[@]} matching APK file(s)." >&2

            echo "All generated APK files:"
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print 2>/dev/null || true

            exit 1
          fi

          APK_PATH="${APKS[0]}"
          echo "Checking APK: $APK_PATH"

          unzip -Z1 "$APK_PATH" > /tmp/shadow-net-apk-entries.txt

          if ! grep -q '^lib/arm64-v8a/' \
            /tmp/shadow-net-apk-entries.txt; then
            echo "arm64-v8a native libraries are missing from APK." >&2
            exit 1
          fi

          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' \
            /tmp/shadow-net-apk-entries.txt; then
            echo "Unexpected non-arm64 libraries were found in APK." >&2

            grep -E '^lib/(armeabi-v7a|x86|x86_64)/' \
              /tmp/shadow-net-apk-entries.txt || true

            exit 1
          fi

          echo "APK contains arm64-v8a only."
          ls -lh "$APK_PATH"

      - name: Upload arm64-v8a debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-net-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-net-build-reports-arm64-v8a
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7
